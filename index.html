/* Layout: sticky command bar (search + unit chips) over a single column of unit sections; rows = seq | rank-name/position | phone */
:root{

}

:root[data-theme="dark"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:.01em}
h1 span{color:var(--accent)}
.count{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.search{position:relative}
.search input{width:100%;font:inherit;font-size:1rem;padding:10px 38px 10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent);outline-offset:-1px}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:1.2rem;cursor:pointer;padding:4px 8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;font:inherit;font-size:.82rem;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--fg);cursor:pointer;white-space:nowrap}
.chip b{font-weight:500;color:var(--muted);margin-left:4px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chip[aria-pressed="true"] b{color:inherit;opacity:.8}
.chip:focus-visible,.copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main .wrap{padding-block:16px 48px;display:grid;gap:22px}
section h2{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:0 0 6px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-bottom:6px;border-bottom:2px solid var(--accent)}
section h2 small{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.row{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto;gap:4px 12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.seq{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums;text-align:right}
.who{min-width:0}
.name{font-weight:600}
.name .rk{color:var(--accent);font-weight:500;margin-right:4px}
.pos{color:var(--muted);font-size:.85rem}
.unit{display:none;color:var(--muted);font-size:.78rem}
.searching .unit{display:block}
.tel{display:flex;align-items:center;gap:6px}
.tel a{color:var(--fg);text-decoration:none;font-variant-numeric:tabular-nums;font-weight:500;user-select:all;white-space:nowrap}
.tel a:hover{color:var(--accent);text-decoration:underline}
.nophone{color:var(--muted);font-size:.85rem}
.copy{font:inherit;font-size:.75rem;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:var(--accent-soft);color:var(--fg);cursor:pointer}
.copy.done{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
mark{background:var(--hit);color:inherit;border-radius:2px}
.empty{text-align:center;color:var(--muted);padding:40px 0}
@media (max-width:520px){
  .row{grid-template-columns:2rem minmax(0,1fr)}
  .tel{grid-column:2}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const $=s=>document.querySelector(s);
const total=DATA.reduce((a,g)=>a+g.p.length,0);
let unit='ทั้งหมด', q='';
try{unit=localStorage.getItem('pb-unit')||unit}catch(e){}
if(unit!=='ทั้งหมด'&&!DATA.some(g=>g.d===unit))unit='ทั้งหมด';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hl=(s,t)=>{s=esc(s);if(!t)return s;const i=s.toLowerCase().indexOf(t.toLowerCase());return i<0?s:s.slice(0,i)+'<mark>'+s.slice(i,i+t.length)+'</mark>'+s.slice(i+t.length)};
function chips(){
  const all=[{d:'ทั้งหมด',n:total},...DATA.map(g=>({d:g.d,n:g.p.length}))];
  $('#chips').innerHTML=all.map(c=>`<button class="chip" type="button" aria-pressed="${c.d===unit}" data-d="${esc(c.d)}">${esc(c.d.replace(' มทบ.11','').replace('.มทบ.11',''))}<b>${c.n}</b></button>`).join('');
}
function render(){
  const t=q.trim(), tn=t.replace(/\D/g,'');
  const groups=DATA.filter(g=>unit==='ทั้งหมด'||g.d===unit).map(g=>({d:g.d,p:g.p.filter(p=>{
    if(!t)return true;
    const s=(p.r+' '+p.f+' '+p.l+' '+p.p).toLowerCase();
    return s.includes(t.toLowerCase())||(tn.length>=3&&p.t.replace(/\D/g,'').includes(tn));
  })})).filter(g=>g.p.length);
  const n=groups.reduce((a,g)=>a+g.p.length,0);
  $('#count').textContent=t||unit!=='ทั้งหมด'?`แสดง ${n} จาก ${total} นาย`:`${total} นาย · ${DATA.length} แผนก`;
  document.body.classList.toggle('searching',!!t);
  $('#list').innerHTML=groups.length?groups.map(g=>`<section><h2>${esc(g.d)}<small>${g.p.length} นาย</small></h2>${g.p.map(p=>`
    <div class="row"><div class="seq">${esc(p.n)}</div>
      <div class="who"><div class="name"><span class="rk">${hl(p.r,t)}</span>${hl(p.f,t)} ${hl(p.l,t)}</div>
        <div class="pos">${hl(p.p||'—',t)}</div><div class="unit">${esc(g.d)}</div></div>
      <div class="tel">${p.t?`<a href="tel:${p.t.replace(/-/g,'')}">${tn.length>=3?hlTel(p.t,tn):p.t}</a><button class="copy" type="button" data-t="${p.t}">คัดลอก</button>`:'<span class="nophone">ไม่มีเบอร์</span>'}</div>
    </div>`).join('')}</section>`).join(''):`<div class="empty">ไม่พบรายชื่อที่ตรงกับ “${esc(t)}”</div>`;
}
function hlTel(tel,tn){const d=tel.replace(/\D/g,''),i=d.indexOf(tn);if(i<0)return tel;let out='',k=0;for(const c of tel){if(/\d/.test(c)){const on=k>=i&&k<i+tn.length;out+=on?'<mark>'+c+'</mark>':c;k++}else out+=c}return out.replace(/<\/mark><mark>/g,'')}
$('#chips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;unit=b.dataset.d;try{localStorage.setItem('pb-unit',unit)}catch(e){}chips();render();window.scrollTo({top:0})});
$('#q').addEventListener('input',e=>{q=e.target.value;$('#clr').hidden=!q;render()});
$('#clr').addEventListener('click',()=>{q='';$('#q').value='';$('#clr').hidden=true;render();$('#q').focus()});
$('#list').addEventListener('click',e=>{const b=e.target.closest('.copy');if(!b)return;const t=b.dataset.t;
  const ok=()=>{b.textContent='คัดลอกแล้ว';b.classList.add('done');setTimeout(()=>{b.textContent='คัดลอก';b.classList.remove('done')},1400)};
  const fb=()=>{const a=b.previousElementSibling,r=document.createRange();r.selectNodeContents(a);const s=getSelection();s.removeAllRanges();s.addRange(r);b.textContent='กด Ctrl+C';setTimeout(()=>b.textContent='คัดลอก',1600)};
  try{navigator.clipboard.writeText(t).then(ok,fb)}catch(err){fb()}});
chips();render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
